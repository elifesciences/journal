    defaults:
         _controller: eLife\Journal\Controller\CollectionsController::collectionAction
         slug: ''
    requirements:
        id: '[a-z0-9-]+'

collections:
    path: /collections
    defaults:
         _controller: eLife\Journal\Controller\CollectionsController::listAction

community:
    path: /community
    defaults:
         _controller: eLife\Journal\Controller\CommunityController::listAction

contact:
