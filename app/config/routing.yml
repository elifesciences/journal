doi:
    path: /lookup/doi/{doi}
    defaults:
         _controller: eLife\Journal\Controller\DoiController::doiAction
    requirements:
        doi: 10\.7554/eLife\.([a-z0-9-]+)

doi-sub:
    path: /lookup/doi/{doi}
    defaults:
         _controller: eLife\Journal\Controller\DoiController::subDoiAction
    requirements:
        doi: 10\.7554/eLife\.([a-z0-9-.]+)

