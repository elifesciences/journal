log-in:
    path: /log-in
    defaults:
        _controller: eLife\Journal\Controller\AuthController::redirectAction

log-in-orcid-visibility-setting:
  path: /log-in/orcid-visibility-setting
  defaults:
    _controller: eLife\Journal\Controller\AuthController::orcidVisibilitySettingAction

log-in-check:
    path: /log-in/check

log-out:
    path: /log-out

home:
    path: /
    defaults:
         _controller: eLife\Journal\Controller\HomeController::homeAction

about:
    path: /about
    defaults:
        _controller: eLife\Journal\Controller\LocalPageStubController::localPageStubAction

about-pubpub:
    path: /about/{type}
    requirements:
      type: '(aims-scope|research-culture|technology|peer-review|publishing-with-elife)'
    defaults:
        _controller: eLife\Journal\Controller\LocalPageStubController::localPageStubAction

about-people:
    path: /about/people/{type}
    defaults:
         _controller: eLife\Journal\Controller\AboutController::peopleAction
         type: ''

alerts:
    path: /alerts
    defaults:
         _controller: eLife\Journal\Controller\AlertsController::alertsAction

annual-reports:
    path: /annual-reports
    defaults:
         _controller: eLife\Journal\Controller\AnnualReportsController::listAction

archive:
    path: /archive
    defaults:
         _controller: eLife\Journal\Controller\ArchiveController::indexAction
    condition: 'request.query.get("year") > 0'

archive-year:
    path: /archive/{year}
    defaults:
         _controller: eLife\Journal\Controller\ArchiveController::yearAction
    requirements:
        year: '[2-9][0-9]{3}'

archive-month:
    path: /archive/{year}/{month}
    defaults:
         _controller: eLife\Journal\Controller\ArchiveController::monthAction
    requirements:
        year: '[2-9][0-9]{3}'

article-version:
    path: /articles/{id}v{version}
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::textAction
    requirements:
        id: '[a-z0-9-]+'
        version: '[1-9][0-9]*'

article-bibtex:
    path: /articles/{id}.bib
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::bibTexAction
    requirements:
        id: '[a-z0-9-]+'

article-version-pdf:
    path: /articles/{id}v{version}.pdf
    defaults:
        _controller: eLife\Journal\Controller\ArticlesController::pdfAction
    requirements:
        id: '[a-z0-9-]+'
        version: '[1-9][0-9]*'

article-pdf:
    path: /articles/{id}.pdf
    defaults:
        _controller: eLife\Journal\Controller\ArticlesController::pdfAction
    requirements:
        id: '[a-z0-9-]+'

article-ris:
    path: /articles/{id}.ris
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::risAction
    requirements:
        id: '[a-z0-9-]+'

article-era:
    path: /articles/{id}/executable
    defaults:
      _controller: eLife\Journal\Controller\ArticlesController::eraAction
    requirements:
        id: '[a-z0-9-]+'

article-era-download:
    path: /articles/{id}/executable/download
    defaults:
      _controller: eLife\Journal\Controller\ArticlesController::eraDownloadAction
    requirements:
        id: '[a-z0-9-]+'

article-type:
    path: /articles/{type}
    defaults:
         _controller: eLife\Journal\Controller\ArticleTypesController::listAction
    requirements:
        type: '(correction|editorial|expression-concern|feature|insight|research-advance|research-article|research-communication|retraction|registered-report|replication-study|review-article|scientific-correspondence|short-report|tools-resources)'

article-version-xml:
    path: /articles/{id}v{version}.xml
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::xmlAction
    requirements:
        id: '[a-z0-9-]+'
        version: '[1-9][0-9]*'

article-xml:
    path: /articles/{id}.xml
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::xmlAction
    requirements:
        id: '[a-z0-9-]+'

article:
    path: /articles/{id}
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::textAction
    requirements:
        id: '[a-z0-9-]+'

article-version-figures:
    path: /articles/{id}v{version}/figures
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::figuresAction
    requirements:
        id: '[a-z0-9-]+'
        version: '[1-9][0-9]*'

article-figures:
    path: /articles/{id}/figures
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::figuresAction
    requirements:
        id: '[a-z0-9-]+'

article-version-peer-reviews:
    path: /articles/{id}v{version}/peer-reviews
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::peerReviewsAction
    requirements:
        id: '[a-z0-9-]+'
        version: '[1-9][0-9]*'

article-peer-reviews:
    path: /articles/{id}/peer-reviews
    defaults:
         _controller: eLife\Journal\Controller\ArticlesController::peerReviewsAction
    requirements:
        id: '[a-z0-9-]+'

