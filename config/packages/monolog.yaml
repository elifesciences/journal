monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - api
        - honeypot

when@dev:
    monolog:
        handlers:
            console:
                channels:
                    - '!event'
                type: console
                formatter: monolog.formatter.line
            main:
                channels:
                    - '!event'
                level: debug
                path: 'php://stderr'
                type: stream

when@ci:
    monolog:
        handlers:
            console:
                channels:
                    - '!event'
                type: console
                formatter: monolog.formatter.line
            main:
                type: 'null'

# prod-shaped handler tree; demo/preview/continuumtest/continuumtest/preview all
# behave like prod here, so they alias this block rather than repeating it.
when@prod: &prod_monolog
    monolog:
        handlers:
            console:
                type: console
            main:
                channels:
                    - '!honeypot'
                action_level: error
                handler: composite
                type: fingers_crossed
                excluded_404s:
                    - ^/
            honeypot:
                channels:
                    - 'honeypot'
                type: group
                members:
                    - composite
            composite:
                type: whatfailuregroup
                members:
                    - text
                    - json
            text:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.txt.log'
                level: debug
                formatter: monolog.formatter.line
            json:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.json.log'
                level: debug
                formatter: monolog.formatter.json

when@demo: *prod_monolog
when@preview: *prod_monolog
when@continuumtest: *prod_monolog
when@continuumtestpreview: *prod_monolog
