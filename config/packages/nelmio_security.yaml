nelmio_security:
    # prevents framing of the entire site
    clickjacking:
        paths:
            '^/.*': DENY

    # disables content type sniffing for script resources
    content_type:
        nosniff: true

    csp:
        enforce:
            frame-ancestors:
                - none
        report:
            level1_fallback: true
            browser_adaptive:
                enabled: true
            report-uri: '%router.request_context.base_url%/my-csp-report'
            script-src:
                - 'self'

    # Send a full URL in the `Referer` header when performing a same-origin request,
    # only send the origin of the document to secure destination (HTTPS->HTTPS),
    # and send no header to a less secure destination (HTTPS->HTTP).
    # If `strict-origin-when-cross-origin` is not supported, use `no-referrer` policy,
    # no referrer information is sent along with requests.
    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer-when-downgrade'
            - 'strict-origin-when-cross-origin'

when@prod: &prod_nelmio_security
    nelmio_security:
        csp:
            enforce:
                default-src:
                    - 'data:'
                    - 'https:'
                    - 'https://*.hotjar.com:*'
                    - 'https://*.hotjar.io'
                    - 'wss://*.hotjar.com'
                script-src:
                    - 'self'
                    - 'unsafe-eval'
                    - 'unsafe-inline'
                    - 'https://consent.cookiebot.com'
                    - 'https://cdn.jsdelivr.net' # MathJax
                    - 'https://cdnjs.cloudflare.com' # PhotoSwipe
                    - 'https://hypothes.is' # Hypothesis annotations
                    - 'https://d1bxh8uas1mnw7.cloudfront.net' # Altmetric badge embed
                    - 'https://www.googletagmanager.com'
                    - 'https://www.googleoptimize.com'
                style-src:
                    - 'self'
                    - 'unsafe-inline' # Highcharts renders charts using inline style attributes
        forced_ssl:
            allow_list:
                - ^/ # Hack to disable redirect.
            hsts_max_age: 31536000 # 1 year
            hsts_subdomains: true
            hsts_preload: true

when@demo: *prod_nelmio_security
when@preview: *prod_nelmio_security
when@continuumtest: *prod_nelmio_security
when@continuumtestpreview: *prod_nelmio_security